show_message:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: pixelwall
          multiple: true
    message:
      required: true
      example: "Er staat iemand voor de deur"
      selector:
        text:
          multiline: true
    title:
      example: "Deurbel"
      selector:
        text:
    icon:
      example: bell
      selector:
        select:
          translation_key: icon
          options:
            - bell
            - info
            - warning
            - check
            - home
            - door
            - lock
            - car
            - mail
            - thermometer
            - water
            - music
            - heart
            - sun
            - bolt
    color:
      selector:
        color_rgb:
    duration:
      selector:
        number:
          min: 3
          max: 600
          unit_of_measurement: s

set_page:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: pixelwall
          multiple: true
    page:
      required: true
      example: thuis
      selector:
        text:
    layout:
      default: grid
      selector:
        select:
          translation_key: layout
          options:
            - grid
            - value
            - list
            - gauge
            - chart
    title:
      example: Thuis
      selector:
        text:
    items:
      required: true
      example: |
        - entity: sensor.woonkamer_temperatuur
          label: Binnen
          icon: thermometer
        - entity: sensor.zonnepanelen_vermogen
          label: Zon
          icon: sun
          color: "#ffcc33"
      selector:
        object:

delete_page:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: pixelwall
          multiple: true
    page:
      required: true
      example: thuis
      selector:
        text:

set_values:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: pixelwall
          multiple: true
    page:
      required: true
      example: afval
      selector:
        text:
    values:
      required: true
      example: '{"gft": "morgen", "papier": "vr 17 okt"}'
      selector:
        object:
